# Deploys the site to GitHub Pages on every push to main, with Astro's official Pages flow:
# withastro/action builds dist/ (npm run build, no gates) and uploads it as the Pages artifact,
# then actions/deploy-pages publishes it. The gates run in check.yml, on PRs and every push.
# public/CNAME stays in the build; the custom domain itself is set in the repo's Pages settings,
# whose source must be "GitHub Actions" for this workflow to publish.
name: Deploy
on:
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: withastro/action@v6
        with:
          node-version: 24
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
